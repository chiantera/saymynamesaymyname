name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6
      - run: npm --prefix frontend ci
      - run: uv sync --directory backend --locked --python 3.12
      - run: npm run check
      - run: uv run --directory backend playwright install --with-deps chromium
      - run: npm run test:auth
