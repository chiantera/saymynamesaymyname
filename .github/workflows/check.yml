name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_DB: companion_test
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d companion_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6
      - run: npm --prefix frontend ci
      - run: uv sync --directory backend --locked --python 3.12
      - run: npm run check
      - run: npm run test:database
        env:
          MEMBERSHIP_TEST_DSN: postgresql://postgres:fixture-only@127.0.0.1:5432/companion_test
      - run: uv run --directory backend playwright install --with-deps chromium
      - run: npm run test:auth
      - run: npm run test:membership
        env:
          MEMBERSHIP_TEST_DSN: postgresql://postgres:fixture-only@127.0.0.1:5432/companion_test
