[project]
name = "relationship-companion-api"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.163.0",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "playwright>=1.65.2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
